# Tool configuration only. Run from the repository root with the backend virtualenv.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"datasets/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["evaluations", "app", "ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../backend"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["(^|/)tests/"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/..:$MYPY_CONFIG_FILE_DIR/../backend"

[[tool.mypy.overrides]]
module = ["ingestion.*", "google.*", "pinecone.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["evaluations.run_evaluation"]
# pydantic-settings accepts `_env_file` at runtime; mypy does not model it.
disable_error_code = ["call-arg"]
