# Tool configuration only. The pipeline runs from the repository root as `python -m ingestion.cli`.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["(^|/)tests/"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "pinecone", "pinecone.*"]
ignore_missing_imports = true
